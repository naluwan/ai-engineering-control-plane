name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI verifies. It does not deploy, does not commit, and does not auto-fix
# dependencies. A failing check is a signal for a human, not something for the
# pipeline to repair.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway PostgreSQL for this job only. The credentials are fixed,
    # ephemeral, CI-only values for a container that is destroyed when the job
    # ends and is never reachable from outside the runner. They are not a
    # production secret and are deliberately not stored as GitHub secrets:
    # putting a well-known throwaway password in a secret would imply it
    # matters.
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: acp
          POSTGRES_PASSWORD: acp_ci_only
          POSTGRES_DB: acp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acp -d acp_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://acp:acp_ci_only@localhost:5432/acp_dev
      TEST_DATABASE_URL: postgresql://acp:acp_ci_only@localhost:5432/acp_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The service container's entrypoint only creates POSTGRES_DB, so the
      # integration-test database is created here. TEST_DATABASE_URL must point
      # at a different database from DATABASE_URL — the suite deletes rows.
      - name: Create integration test database
        run: |
          PGPASSWORD=acp_ci_only psql -h localhost -U acp -d acp_dev \
            -c 'CREATE DATABASE acp_test OWNER acp;'

      # Runs the root postinstall, which runs `prisma generate`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to the application database
        run: pnpm exec prisma migrate deploy

      - name: Apply migrations to the integration test database
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Runs both vitest projects: unit/component and repository integration.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
